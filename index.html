<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadlineSF — Free Patch</title>
<style>
  :root{
    --bg:#050505; --ink:#f5f5f5; --muted:#8a8a8a;
    --accent:#ff3b2f; --line:#1c1c1c; --card:#0d0d0d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; text-align:center; padding:32px 20px;
  }
  .brand{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; font-size:.8rem; color:var(--muted); margin-bottom:40px;
  }
  .brand b{color:var(--ink)}
  h1{
    font-size:clamp(2rem,7vw,3.4rem); line-height:1.05; font-weight:800;
    letter-spacing:-.02em; margin-bottom:14px;
  }
  h1 .hi{color:var(--accent)}
  .sub{color:var(--muted); font-size:1rem; margin-bottom:44px}
  .install{
    appearance:none; border:0; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:800;
    font-size:1.35rem; letter-spacing:.02em;
    padding:26px 64px; border-radius:14px;
    box-shadow:0 0 0 0 rgba(255,59,47,.55);
    transition:transform .12s ease, box-shadow .3s ease;
    animation:pulse 2.4s infinite;
  }
  .install:hover{transform:translateY(-2px)}
  .install:active{transform:translateY(1px)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,59,47,.5)}
    70%{box-shadow:0 0 0 22px rgba(255,59,47,0)}
    100%{box-shadow:0 0 0 0 rgba(255,59,47,0)}
  }
  .voice{
    margin-top:26px; color:var(--muted); font-size:.9rem;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em;
  }
  .voice b{color:var(--ink)}
  /* success state */
  #done{display:none; max-width:520px}
  #done h1{font-size:clamp(1.8rem,6vw,2.8rem)}
  .check{
    width:76px;height:76px;border-radius:50%;border:3px solid var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 26px;
    font-size:2.4rem;color:var(--accent)
  }
  .foot{position:fixed;bottom:18px;left:0;right:0;color:#3a3a3a;font-size:.7rem;
    font-family:ui-monospace,monospace;letter-spacing:.15em}
</style>
</head>
<body>

  <!-- STEP 1: the offer -->
  <main id="offer">
    <div class="brand">// <b>DEADLINESF</b></div>
    <h1>Your free <span class="hi">patch</span>.<br>One click.</h1>
    <p class="sub">Fixes the gap. Nothing to type.</p>
    <button class="install" onclick="install()">INSTALL FREE PATCH</button>
    <p class="voice">or just say <b>“yes”</b></p>
  </main>

  <!-- STEP 2: confirmation -->
  <main id="done">
    <div class="check">✓</div>
    <h1>Patch <span class="hi">ready.</span></h1>
    <p class="sub">Check your inbox — your fix and certificate are on the way.</p>
  </main>

  <div class="foot">DEADLINESF</div>

<script>
  function install(){
    document.getElementById('offer').style.display='none';
    document.getElementById('done').style.display='block';
    // TODO: hook this to the generator/email + consent log
  }
  // "just say yes" — voice trigger (works where the browser allows mic)
  try{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR){
      const r = new SR(); r.continuous=true; r.interimResults=false; r.lang='en-US';
      r.onresult = e=>{
        const t = e.results[e.results.length-1][0].transcript.toLowerCase();
        if(t.includes('yes')) install();
      };
      // start on first user tap anywhere (mic needs a gesture)
      document.body.addEventListener('click',()=>{try{r.start()}catch(_){}}, {once:true});
    }
  }catch(_){}
</script>
</body>
</html>
